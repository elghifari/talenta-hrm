name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hrm_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: hrm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrm_ci -d hrm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hrm_ci:synthetic-ci-only@127.0.0.1:5432/hrm_ci
      DJANGO_SETTINGS_MODULE: config.settings.development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.17
      - run: uv sync --frozen --group browser
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend test -- --run
      - run: npm --prefix frontend run build
      - run: uv run --group browser playwright install --with-deps chromium
      - run: uv run python backend/manage.py check
      - run: uv run python backend/manage.py migrate --noinput
      - run: uv run python backend/manage.py makemigrations --check --dry-run
      - run: uv run pytest -q
      - run: uv run --group browser pytest --run-browser tests/browser -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
