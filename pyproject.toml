[project]
name = "talenta-hrm"
version = "0.1.0"
description = "Talenta Center internal HR administration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "psycopg[binary]>=3.2,<4",
    "dj-database-url>=3,<4",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-django>=4.11,<5", "ruff>=0.15,<1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
